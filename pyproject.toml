[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-surface-map"
version = "0.1.0"
description = "Local-first install-risk reviewer for coding agents and MCP tools."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Agent Surface Map contributors" }]
keywords = ["mcp", "coding-agents", "security", "cli", "gemma"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
yaml = ["PyYAML>=6,<7"]
all = ["PyYAML>=6,<7"]

[project.scripts]
asm = "agent_surface_map.cli:main"

[project.urls]
Homepage = "https://gemma-agent-surface-map.vercel.app"
Repository = "https://github.com/dodge1218/agent-surface-map"

[tool.setuptools]
py-modules = [
  "asm_cli",
  "drift_watch",
  "mcp_server",
  "policy",
  "remediation_apply",
  "remediation_approval",
  "remediation_pr_body",
  "remediation_renderer",
  "runtime_telemetry",
  "reviewers",
  "server",
  "surface_map",
]
packages = ["api", "agent_surface_map", "agent_surface_map.mcp", "agent_surface_map.reports", "agent_surface_map.schemas"]
include-package-data = true

[tool.setuptools.package-data]
"agent_surface_map.schemas" = ["*.json"]
